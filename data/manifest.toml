# NASA Exoplanet Archive, Planetary Systems Composite Parameters (pscomppars): one TAP query on 2026-11-22,
# 6,473 planets around 4,865 hosts, 1,508,523 B. Baked by
#   uni-bake exo --input data/cache/exoplanets/pscomppars.csv --stars data/baked/athyg_m10.bin
#     --athyg data/cache/athyg-m10/athyg_40_reduced_m10.csv.gz --out data/baked/exoplanets.ron
# into data/baked/exoplanets.ron (4,839 systems, 6,447 planets, 2,621,833 B). pl_tranmid_systemref is fetched
# beyond the plan's column list, to record the time standard of pl_tranmid.
# Column definitions: https://exoplanetarchive.ipac.caltech.edu/docs/API_PS_columns.html
#   sha256 20c13ec5493887f3d901a1f62c264ab0dcc95135e1f417b79374fdd737b9c222 (pl_orblper: "as-reported for each
#   publication", either the planet's or the star's argument of periastron)
# Acknowledgement text: https://exoplanetarchive.ipac.caltech.edu/docs/acknowledge.html
#   sha256 93e26a9a52e75d81aefd656c3a82f294dcd81a2538fe75cae73e5842abe0bc4b
[[entry]]
id = "exoplanets"
url = "https://exoplanetarchive.ipac.caltech.edu/TAP/sync?query=select+pl_name,hostname,hip_name,hd_name,gaia_dr3_id,ra,dec,sy_dist,sy_vmag,st_teff,st_rad,pl_orbsmax,pl_orbeccen,pl_orbincl,pl_orblper,pl_orbper,pl_tranmid,pl_tranmid_systemref,pl_bmassj,pl_radj,pl_eqt,discoverymethod,disc_year+from+pscomppars&format=csv"
sha256 = "b1d2baadf8d60830d34cb6ec0c21fba5b84fb8dc8f0470ba6ff20dfb3cf0ac80"
license = "public (NASA Exoplanet Archive; acknowledgement requested)"
credit = "This research has made use of the NASA Exoplanet Archive, which is operated by the California Institute of Technology, under contract with the National Aeronautics and Space Administration under the Exoplanet Exploration Program."
raw_path = "data/cache/exoplanets/pscomppars.csv"
baked_path = "data/baked/exoplanets.ron"
