# ESA 1997, The Hipparcos and Tycho Catalogues, ESA SP-1200 vol. 1 (11,456,841 B, downloaded 2026-11-22 for
# Task A7 fix round 1). §1.3 Appendix 4 (p. 57), Table 1.3.4 "Transformation from the Tycho photometric
# system to Johnson" is transcribed into tools/bake/src/athyg.rs (`TYCHO_TABLE_1_3_4`), so the PDF is not
# needed for a re-bake. The same appendix says the linear transformation "should not be applied to M-type
# stars", which is why red dwarfs take the dwarf sequence instead.
