# NASA Exoplanet Archive, Planetary Systems Composite Parameters (pscomppars): one TAP query on 2026-11-22,
# 6,473 planets around 4,865 hosts, 1,508,523 B. Baked by
#   uni-bake exo --input data/cache/exoplanets/pscomppars.csv --stars data/baked/athyg_m10.bin
#     --athyg data/cache/athyg-m10/athyg_40_reduced_m10.csv.gz --out data/baked/exoplanets.ron
# into data/baked/exoplanets.ron (4,839 systems, 6,447 planets, 2,621,833 B). pl_tranmid_systemref is fetched
# beyond the plan's column list, to record the time standard of pl_tranmid.
# Column definitions: https://exoplanetarchive.ipac.caltech.edu/docs/API_PS_columns.html
#   sha256 20c13ec5493887f3d901a1f62c264ab0dcc95135e1f417b79374fdd737b9c222 (pl_orblper: "as-reported for each
#   publication", either the planet's or the star's argument of periastron)
