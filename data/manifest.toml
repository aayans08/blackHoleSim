# Data manifest: one [[entry]] per downloaded data file (design §5.4, §10).
# Every entry also needs a credit in ATTRIBUTION.md. Raw downloads live in data/cache/ (git-ignored)
# and are deleted after baking; small baked outputs in data/baked/ are committed.
#
# Fields (all strings, all required):
#   id          short stable name, e.g. "bsc5"
#   url         exact download URL
#   sha256      hex SHA-256 of the downloaded raw file
#   license     licence of the source data
#   credit      citation / credit line as the source asks for it
#   raw_path    where the raw download goes, relative to the repo root (under data/cache/)
#   baked_path  the baked output, relative to the repo root (under data/baked/)
#
# Template (copy, uncomment, fill in):
# [[entry]]
# id = ""
# url = ""
# sha256 = ""
# license = ""
# credit = ""
# raw_path = "data/cache/<id>/..."
# baked_path = "data/baked/<id>.bin"

# Yale Bright Star Catalogue, 5th revised ed. (CDS V/50), baked by `uni-bake bsc5`.
# Canonical CDS URL: https://cdsarc.cds.unistra.fr/ftp/V/50/catalog.gz. On 2026-11-20 that server
# answered 404 ("This page is currently unavailable") for every V/50 file, so the file was
# fetched from CDS's VizieR mirror at the CfA (url below). The gzip header names the member
# "catalog", modified 1993-10-04, matching the CDS history note of 02-Oct-1993.
# Format description used for the byte columns: the same mirror's ReadMe,
# https://vizier.cfa.harvard.edu/ftp/cats/V/50/ReadMe (data/cache/bsc5/ReadMe),
# sha256 44fd9c73e2eecad0beb47bdfa3f01c60fd43f93d6964198e31fcd48732de5b33.
[[entry]]
id = "bsc5"
url = "https://vizier.cfa.harvard.edu/ftp/cats/V/50/catalog.gz"
sha256 = "3dc44b1e90be8fbe5bcc7656032560f51275f985c7e3f783c9028e1838ec7bed"
license = "public (CDS V/50)"
credit = "Hoffleit & Warren 1991, Yale Bright Star Catalogue 5th ed. via CDS"
raw_path = "data/cache/bsc5/catalog.gz"
baked_path = "data/baked/bsc5.bin"

# M1 Wave A data sections (pre-split by Task A0b, review I8). Each Data task adds its [[entry]]
# blocks only between its own markers.

# --- A7 ---
# AT-HYG v4.0 stars (V ≤ 10) and names, NASA Exoplanet Archive pscomppars (M1 Task A7).
# --- end A7 ---

# --- A8 ---
# Solar System Scope 8k maps, NASA/USGS tier-B mosaics, Saturn's ring profile (M1 Task A8).
# --- end A8 ---

# --- A9 ---
# JPL SBDB small bodies, JPL SSD satellites, NSSDCA facts, JPL Horizons goldens, fonts (M1 Task A9).

# JPL Horizons spot values (A9 Step 1, dispatch A9.1): test goldens, never drawn. Fetched
# 2026-11-22 16:49 UTC (Horizons' stamp: Sun Nov 22 08:49:08 2026 Pasadena) by
# `cargo run -p uni-bake -- horizons --plan m1 --out data/golden/horizons_spots.ron --sky data/golden/sky_spots.ron`:
# one GET of the Horizons API (version 1.2) per request, 39 in all, each raw JSON answer saved as
# data/cache/horizons/NNN-<kind>-<target>@<centre>.json and deleted after the bake. Every answer
# embeds its query time, so the raw bytes cannot be reproduced; sha256 below is of this fetch's
# answers concatenated in file-name order (`cat data/cache/horizons/0*-vectors-*.json | shasum -a 256`).
# An independent fetch 2.5 minutes earlier gave bit-identical values for all 159 spots.
# Query parameters, epochs and each answer's ephemeris source are in the baked files' headers.
# Vectors: 31 answers, 182 320 B raw. Baked: 151 spots, 32 195 B,
# sha256 20b8acfd269c0114d92ac31961e153e2ffaa9df8e0a984921979caecf77a9eb4.
[[entry]]
id = "horizons"
url = "https://ssd.jpl.nasa.gov/api/horizons.api"
sha256 = "1d5db1ce468cf9eb872d9961483afba4034a57b91f73e3c0be77e28403ed67a6"
license = "public JPL Solar System Dynamics data (no stated terms; cited as the Horizons manual asks)"
credit = "Giorgini, JD and JPL Solar System Dynamics Group, NASA/JPL Horizons On-Line Ephemeris System, https://ssd.jpl.nasa.gov/horizons/, data retrieved 2026-Nov-22; DE441 (Park et al. 2021, AJ 161, 105) and JPL satellite ephemerides"
raw_path = "data/cache/horizons/0*-vectors-*.json"
baked_path = "data/golden/horizons_spots.ron"

# Observer tables (geocentric, quantities 1,9,19,20,24 for the planets and 1,20 for C/2020 F3):
# 8 answers, 60 831 B raw, sha256 as above over `0*-observer-*.json`. Baked: 8 rows, 3 413 B,
# sha256 e347789f2c459a27554419909e6b8170017f5735338f7fd6a655a45d67cc1d80.
[[entry]]
id = "horizons-sky"
url = "https://ssd.jpl.nasa.gov/api/horizons.api"
sha256 = "517f635a57f73dbaf6f25fe2a55bb549de386aed77a789fd5612340fa042d30a"
license = "public JPL Solar System Dynamics data (no stated terms; cited as the Horizons manual asks)"
credit = "Giorgini, JD and JPL Solar System Dynamics Group, NASA/JPL Horizons On-Line Ephemeris System, https://ssd.jpl.nasa.gov/horizons/, data retrieved 2026-Nov-22; DE441 (Park et al. 2021, AJ 161, 105) and JPL satellite ephemerides"
raw_path = "data/cache/horizons/0*-observer-*.json"
baked_path = "data/golden/sky_spots.ron"
# --- end A9 ---
