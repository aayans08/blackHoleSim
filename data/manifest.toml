sha256 = "a9ec5d515d1222d5bf86e8e84e762cbd325938cc6bd4b0d8760327386fa7c151"
license = "CC BY-SA 4.0"
credit = "AT-HYG database v4.0, D. Nash (astronexus), https://codeberg.org/astronexus/athyg; built from ESA Gaia DR3 (Gaia/DPAC), Tycho-2 and Hipparcos (ESA), the Yale Bright Star and Gliese-Jahreiss catalogues and HYG"
raw_path = "data/cache/athyg-m10/athyg_40_reduced_m10.csv.gz"
baked_path = "data/baked/athyg_m10.bin"

# Mean dwarf colours by spectral type, used for the B−V of the 650 AT-HYG stars that have no colour index
# but a spectral type, and (columns Mv and B-V, K4V–M9V) for the B−V of the 354 red dwarfs whose Tycho
# BT−VT is redder than ESA Table 1.3.4. The values are transcribed into tools/bake/src/athyg.rs
# (`DWARF_BV`, `DWARF_MV_BV`), so the file itself is not needed for a re-bake. Version 2022.04.16;
# re-downloaded for the fix round with the same sha256.
